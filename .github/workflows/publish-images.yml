name: Publish image (GHCR)

# Publie l'image de production sur ghcr.io/kgtech-org/dira-core-api dès qu'un
# push sur main touche le code du service. Un seul binaire : `api`.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "locales/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: La VERSION qui sera gravée dans l'image
        # ⚠️ `dira_build_info` ne vaut que par son ÉTIQUETTE, et sans cet
        # argument chaque image se déclarait `dev` : la première question posée
        # après un déploiement — « quelle version tournait au moment du pic ? »
        # — restait sans réponse, et la mesure existait pour rien.
        # `main-a569da6` se recoupe directement avec `git log --oneline`.
        id: version
        run: echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DIRA_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

