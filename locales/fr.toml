# --- LA PORTE PAR CODE (voir internal/user/otp.go) ---
# ⚠️ Ces phrases s'affichent sur l'écran de saisie des six chiffres, et elles
# disent QUOI FAIRE : « redemandez un code » vaut mieux que « code invalide »
# devant quelqu'un qui attend depuis six minutes.

[errors.otp_invalid]
other = "Code incorrect. Vérifiez les six chiffres, ou demandez-en un nouveau."

[errors.otp_expired]
other = "Ce code a expiré. Demandez-en un nouveau."

[errors.otp_too_many_attempts]
other = "Trop d'essais. Demandez un nouveau code."

[errors.otp_too_soon]
other = "Un code vient de vous être envoyé. Patientez avant d'en redemander un."

[errors.otp_too_many_requests]
other = "Trop de codes demandés pour ce numéro. Réessayez dans un moment."

# ⚠️ Elle ne dit PAS « ce compte n'est pas un compte client » : ce serait
# confirmer qu'il existe à qui essaie des numéros.
[errors.otp_not_available]
other = "Ce compte se connecte avec un mot de passe."

[errors.otp_delivery_failed]
other = "Le code n'a pas pu être envoyé. Réessayez."


# UN SEUL APPAREIL PAR CHAUFFEUR. ⚠️ La phrase ne nomme PAS l'appareil : le
# libellé voyage dans `error.reason`, et un gabarit qui l'insérerait ici
# afficherait « <no value> » les fois où l'application ne l'a pas envoyé.
# C'est à l'écran de composer « … sur Tecno Spark 10 » quand il l'a.
[errors.session_superseded]
other = "Vous avez été déconnecté : votre compte vient d'être ouvert sur un autre appareil."

