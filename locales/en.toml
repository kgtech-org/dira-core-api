# --- THE CODE DOOR (see internal/user/otp.go) ---
# ⚠️ These sentences are read on the six-digit screen, and they say WHAT TO DO:
# "ask for a new code" beats "invalid code" in front of someone who has been
# waiting six minutes.

[errors.otp_invalid]
other = "Wrong code. Check the six digits, or ask for a new one."

[errors.otp_expired]
other = "This code has expired. Ask for a new one."

[errors.otp_too_many_attempts]
other = "Too many attempts. Ask for a new code."

[errors.otp_too_soon]
other = "A code has just been sent to you. Wait before asking for another."

