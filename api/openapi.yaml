openapi: 3.1.0
info:
  title: Dira Core API
  version: 0.1.0
  description: >-
    Socle de la plateforme Dira : identité, portefeuilles, paiements,
    notifications, véhicules et notes. Les verticales `dira-food-api`
    (livraison) et `dira-vtc-api` (courses) se posent dessus.


    ⚠️ Derrière la passerelle, ces routes sont servies à la RACINE
    (`/api/v1/...`), sans préfixe de verticale : l'authentification et le
    portefeuille sont les mêmes pour les deux, et les préfixer obligerait une
    application à choisir une verticale juste pour se connecter.


    ⚠️ Les routes `/internal/...` NE FIGURENT PAS ici. Elles portent les
    pouvoirs d'un service — débiter un portefeuille, ouvrir un compte — sont
    gardées par un secret partagé, et ne sont appelées par aucune application.
    Leur liste vit dans `internal/serviceapi/`, et un test refuse toute route
    qui s'y ajouterait sans être déclarée.


    **Erreurs.** Une seule enveloppe : `{"error":{"code","message"}}`, le
    message dans la langue de `Accept-Language`. Un `validation_failed`
    (422) ajoute `fields` — les clés JSON en cause — et, quand la valeur
    d'un champ n'est pas en cause, `reason` : `unknown_field` (une clé que
    la route ne connaît pas : elle est REFUSÉE, pas ignorée, pour qu'une
    application ne croie pas avoir enregistré ce qui a été jeté) ou
    `invalid_json`.


    **Téléphones.** Toujours en E.164 avec le `+` et l'indicatif ; les
    séparateurs (espaces, points, tirets) sont tolérés et retirés. Le
    numéro est l'identifiant du compte : « 22899000001 » sans `+` est
    refusé (`fields: ["phone"]`), il ne devine pas un pays.


    **Pays.** Toute donnée est bornée par PAYS (ISO 3166-1 alpha-2). Une
    application envoie le sien dans l'en-tête `X-Dira-Country` ; le serveur
    répond avec le pays RETENU dans le même en-tête. Pour un compte
    ordinaire, le pays du compte (dans le jeton, `cty`) s'impose ; seul un
    compte de direction (`cty_any`) change de pays par l'en-tête. Sans
    jeton — inscription, connexion —, l'en-tête est admis s'il nomme un
    pays ouvert (`GET /countries`), sinon le pays par défaut du
    déploiement. Une application trouve son pays par
    `POST /me/country/resolve`.
servers:
  - url: /api/v1
tags:
  - name: countries
    description: La couche pays — où Dira est ouvert, dans quel pays je suis
  - name: map-markers
    description: Les marqueurs de carte hors véhicules — livreur, client, marchand, arrêt — et leurs images
  - name: auth
    description: Inscription, connexion, rotation de jeton
  - name: users
    description: Profil, préférences, carnet d'adresses
  - name: wallet
    description: Portefeuille de jetons et solde Dira
  - name: payments
    description: Mobile money — initiation, statut, rappels du prestataire
  - name: notifications
    description: Boîte de réception, appareils, gabarits multilingues
  - name: ratings
    description: Avis déposés par les verticales, lus par tout le monde
  - name: admin
    description: Administration des comptes — commune aux deux verticales
  - name: uploads
    description: Envoi de fichiers — une porte pour toute la plateforme
  - name: finance
    description: |
      LA COMPTABILITÉ. La FACTURATION par pays et par métier (des jetons à
      l'acceptation ou une commission en pourcentage ; à quelle étape le
      client est débité), le JOURNAL en partie double que chaque mouvement de
      portefeuille écrit dans la même transaction, l'APERÇU (balance des
      comptes, produits, dettes) et l'INTÉGRITÉ : un balayage recalcule
      chaque solde depuis ses mouvements, vérifie le journal, et alerte le
      staff (`staff_finance_alert`) — un solde modifié sans mouvement se voit.
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: >-
        `role` ∈ client | driver | merchant (défaut client ; `admin` refusé,
        422). `first_name` / `last_name` sont facultatifs — `name` reste le
        nom d'affichage. Un livreur reçoit son portefeuille de jetons, un
        client son Dira Cash.


        **Pays du compte** : l'en-tête `X-Dira-Country` s'il nomme un pays
        ouvert (l'application a résolu sa position avant de s'inscrire),
        sinon l'INDICATIF du téléphone (`+229` → BJ), sinon le pays par
        défaut. La réponse le porte dans `user.country` et dans l'en-tête.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name, password]
              properties:
                phone: {type: string, description: E.164 avec le +}
                name: {type: string, maxLength: 120}
                password: {type: string, minLength: 8, maxLength: 128}
                role: {type: string, enum: [client, driver, merchant]}
                email: {type: string, format: email}
                first_name: {type: string, maxLength: 80}
                last_name: {type: string, maxLength: 80}
      responses:
        "201": {description: Account created with a token pair}
        "409": {description: phone_taken}
        "422": {description: "validation_failed — `fields` names the keys"}
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: >-
        **`app` dit QUELLE APPLICATION demande la connexion**, et le socle
        refuse un compte qui n'y a rien à faire : un client ne se connecte pas
        dans l'application chauffeur, ni l'inverse. ⚠️ Sans ce champ, le mot de
        passe suffisait : le jeton était émis, puis chaque écran répondait 403
        et la personne croyait l'application cassée au lieu de comprendre
        qu'elle s'était trompée d'application.


        Correspondance : `client` → compte client, `driver` → chauffeur ET
        livreur (une seule application de course), `merchant` → marchand,
        `console` → direction.


        **Deux portes restent ouvertes, volontairement.** Un `app` ABSENT ne
        vérifie rien : une application pas encore mise à jour continue de
        fonctionner telle quelle. Et un compte de DIRECTION entre partout —
        l'exploitation doit pouvoir ouvrir l'application d'un chauffeur pour
        reproduire ce qu'il décrit.


        Le refus `403 wrong_app` DIT OÙ ALLER : **`error.reason`** nomme
        l'application à ouvrir. ⚠️ `reason`, et rien d'autre — l'enveloppe
        d'erreur ne rend que `code`, `message`, `fields` et `reason` ; il n'y a
        pas de `meta` sur le fil. L'application affiche « Ce compte est un
        compte client, ouvrez l'application Dira » plutôt qu'un échec nu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: {type: string, description: E.164 avec le +}
                password: {type: string}
                app:
                  type: string
                  enum: [client, driver, merchant, console]
                  description: >-
                    L'application qui demande. Omis = aucune vérification
                    (compatibilité).
      responses:
        "200": {description: Token pair}
        "401": {description: invalid_credentials}
        "403":
          description: >-
            `wrong_app` — le compte existe, le mot de passe est bon, mais il
            n'appartient pas à cette application ; `error.reason` nomme
            la bonne. Ou `account_suspended`.
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >-
        **Durées de vie.** L'access token vit `JWT_ACCESS_TTL` (défaut
        **15 min** ; staging **10 min** pour rendre l'expiration testable),
        le refresh token `JWT_REFRESH_TTL` (défaut **30 jours**). Le refresh
        est **consommé** : le rejouer répond 401 — deux requêtes concurrentes
        avec le même en invalident une. ⚠️ L'access token, lui, reste
        **valide jusqu'à son échéance** même après une rotation : une
        connexion WebSocket ouverte avec l'ancien jeton n'est pas coupée par
        le rafraîchissement — c'est le suivi qui la ferme, à l'échéance,
        avec le code 4401 `token_expired`, et le client revient avec le
        nouveau. Un court chevauchement est donc normal.
      responses:
        "200": {description: New token pair}
        "401": {description: refresh token consumed, expired or revoked — sign in again}
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      responses:
        "204": {description: Signed out}
  /me:
    get:
      tags: [users]
      summary: Own profile
      description: >-
        Porte `country` (le pays du compte) et, pour un compte de direction
        seulement, `country_any: true` — ce compte peut regarder un autre
        pays par l'en-tête `X-Dira-Country`.
      responses:
        "200": {description: Profile}
    patch:
      tags: [users]
      summary: Update own profile
      responses:
        "200": {description: Profile}
  /countries:
    get:
      tags: [countries]
      summary: Countries where Dira is open
      security: []
      description: >-
        PUBLIC. Les pays OUVERTS, avec leur fiche : nom, MONNAIE (code,
        symbole, décimales — ce qu'il faut pour afficher un montant),
        indicatif, langue, fuseau, centre. `default` nomme le pays du déploiement —
        celui qu'une requête sans jeton ni en-tête reçoit. Cinq pays sont
        ouverts d'office : Togo, Sénégal, Guinée, Tchad, Gabon. Une application
        s'en sert avant toute connexion : proposer l'indicatif à
        l'inscription, dire « Dira n'est pas encore chez vous ».
      responses:
        "200":
          description: Open countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: {type: string, example: TG}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Country"}
  /me/country/resolve:
    post:
      tags: [countries, users]
      summary: Resolve the caller's country and align the account
      description: >-
        « Dans quel pays suis-je ? ». Deux signaux, dans l'ordre : la
        POSITION de l'appareil (`lng`, `lat`), si l'application l'envoie —
        c'est la vérité, à cent mètres près ; puis l'ADRESSE IP de la
        requête, sans position ou quand la position est hors zone. Un signal
        qui désigne un pays non ouvert ne vaut pas : `supported: false`,
        `detected` dit où la personne est, et `country` reste celui du
        compte (ou le pays par défaut).


        Le pays du compte est MIS À JOUR quand le pays retenu est sûr et
        différent (`updated: true`). ⚠️ Le jeton en cours porte encore
        l'ancien : l'application doit RAFRAÎCHIR sa session pour voir ses
        listes bornées au nouveau pays. Corps vide admis (IP seule).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lng: {type: number, minimum: -180, maximum: 180}
                lat: {type: number, minimum: -90, maximum: 90}
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CountryResolution"}
        "422": {description: lng and lat go together}
  /admin/countries:
    get:
      tags: [admin, countries]
      summary: The whole catalog with each country's state
      description: >-
        Tout le catalogue — ouverts ou non — pour l'écran de réglage. Le
        catalogue lui-même (frontières, monnaies) est dans le code :
        ouvrir un pays qui n'y est pas demande un déploiement.
      responses:
        "200": {description: Catalog}
  /admin/countries/{code}:
    put:
      tags: [admin, countries]
      summary: Open or close a country, set its currency
      description: >-
        Les deux champs sont facultatifs — on change l'un sans toucher à
        l'autre. `currency` : un code ISO 4217 connu (`XOF`, `XAF`, `GNF`,
        `GHS`, `NGN`, `EUR`, `USD`) ; vide = revenir à la monnaie du
        catalogue. ⚠️ La monnaie se DÉCLARE, elle ne convertit rien : les
        montants créés sous ce pays sont dans cette monnaie, en entiers de sa
        plus petite unité.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: BJ}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                currency: {type: string, example: GNF}
      responses:
        "200": {description: Country}
        "404": {description: country_unknown — not in the catalog}
        "409": {description: country_default — the default country cannot be closed}
        "422": {description: unknown currency, or nothing to update}
  /map-markers:
    get:
      tags: [map-markers]
      summary: The platform's map markers — courier, client, merchant — with their images
      description: |
        PUBLIC, sans jeton : une application dessine des cartes avant même la
        connexion. Toujours les TROIS genres, dans cet ordre — `courier` (le
        livreur ; le chauffeur VTC est dessiné par son mode de véhicule),
        `client`, `merchant` (le point de vente, la collecte).

        Chacun porte deux images FACULTATIVES, comme un mode de véhicule :
        `icon_url` (à côté d'un nom, dans une liste) et `map_icon_url` (dans
        la pastille du marqueur). Absentes, gardez votre pictogramme — le
        réglage ajoute, il ne retire rien.

        ⚠️ **LES PINS NUMÉROTÉS (v4.18.0).** `client` et `merchant` portent en
        plus jusqu'à **quatre** pins numérotés (`numbered`, rangs 1 à 4,
        toujours servis au complet même vides). Une carte porte souvent
        plusieurs points du même genre — une commande collectée chez trois
        marchands, une course qui s'arrête deux fois — et un seul pictogramme
        pour tous ces points ne dit pas dans quel ORDRE on y passe, qui est
        justement ce qu'on cherche.

        Le rang est celui du PASSAGE : la 1re collecte porte le pin 1.
        Au-delà de `max_numbered`, ou quand le rang n'est pas réglé,
        **retombez sur le pin principal** — c'est prévu, pas une panne.

        ⚠️ **`stop` A FUSIONNÉ DANS `client`.** Un arrêt de course et l'adresse
        d'un client sont le même objet vu à deux moments. Les étapes d'une
        course se dessinent avec les pins numérotés du client.

        Mettez les images en cache par URL : elles changent d'URL quand elles
        changent. Pour toute la plateforme, pas par pays.
      responses:
        "200":
          description: Markers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MapMarker"}
  /admin/map-markers/{kind}:
    put:
      tags: [admin, map-markers]
      summary: Set (or clear) the images of a map marker
      description: |
        Exploitation du socle. La requête décrit l'ÉTAT VOULU : les champs
        omis sont effacés, y compris les pins numérotés — un enregistrement
        partiel aurait laissé traîner un pin qu'on croyait retiré. Les images
        s'envoient par `POST /uploads?kind=marker`.

        Un rang hors bornes ou en double est REFUSÉ (422), jamais ignoré : un
        pin silencieusement écarté se remarque des semaines plus tard. Un pin
        sans image est en revanche écarté — c'est ainsi qu'on en retire un.
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [courier, client, merchant]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                icon_url: {type: string, format: uri}
                map_icon_url: {type: string, format: uri}
                nav_icon_url: {type: string, format: uri, description: "refusé pour un genre qui ne bouge pas"}
                dest_icon_url: {type: string, format: uri, description: "refusé pour un genre qui n'est la destination de personne"}
                numbered:
                  type: array
                  maxItems: 4
                  description: "refusé pour `courier` : il n'y a qu'un livreur par course"
                  items:
                    type: object
                    properties:
                      index: {type: integer, minimum: 1, maximum: 4}
                      map_icon_url: {type: string, format: uri}
      responses:
        "200": {description: Marker, content: {application/json: {schema: {$ref: "#/components/schemas/MapMarker"}}}}
        "404": {description: marker_not_found — unknown kind}
        "422": {description: rang de pin hors bornes, en double, ou genre qui n'en porte pas}
  /me/preferences:
    patch:
      tags: [users]
      summary: Update notification, theme and language preferences
      description: >-
        Champs absents inchangés. `locale` ∈ `fr` | `en` — les deux langues
        de la plateforme ; `fr-FR` est ramené à `fr`, autre chose est refusé
        (422, `fields: ["locale"]`) ; vide = revenir à la langue de
        l'appareil. `theme` ∈ system | light | dark. `sounds` est accepté
        mais l'app chauffeur ne l'écrit plus (réglage devenu local).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_updates: {type: boolean}
                chat_messages: {type: boolean}
                promotions: {type: boolean}
                tombola: {type: boolean}
                sounds: {type: boolean}
                theme: {type: string, enum: [system, light, dark]}
                locale: {type: string, enum: [fr, en, ""]}
                payment_provider: {type: string}
      responses:
        "200": {description: Profile}
        "422": {description: validation_failed}
  /me/addresses:
    get:
      tags: [users]
      summary: Own address book
      responses:
        "200": {description: Addresses}
    post:
      tags: [users]
      summary: Save an address
      responses:
        "201": {description: Address}
  /me/addresses/{id}:
    put:
      tags: [users]
      summary: Update an address
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Address}
    delete:
      tags: [users]
      summary: Delete an address
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
  /uploads:
    post:
      tags: [uploads]
      summary: Upload a media file and get its public URL
      description: >-
        Tout rôle connecté. AU SOCLE, pas dans une verticale : un avatar est
        un objet du profil, une photo de véhicule ou un permis servent aux
        deux métiers, et les courses n'avaient aucune porte d'envoi. L'URL
        rendue se rattache ensuite à l'objet (`PATCH /me`, véhicule,
        document de conformité, plat…) — l'étape est séparée pour qu'un
        envoi qui échoue ne fasse pas perdre la saisie.


        Images (jpeg, png, webp, svg) jusqu'à 5 MiB pour tout `kind`. Le
        `kind` `feed` accepte AUSSI des vidéos (mp4, webm, mov) jusqu'à
        60 MiB — un clip promo pèse des dizaines de mégaoctets, rien d'autre
        ne doit profiter de ce plafond. Une vidéo de feed est un SHORT : la
        durée est lue dans le conteneur, jamais déclarée, et au-delà de 60 s
        c'est `video_too_long` ; un conteneur illisible est `video_unreadable`
        plutôt qu'accepté à l'aveugle. La durée mesurée revient dans
        `duration_seconds`.


        ⚠️ Le type est celui DÉCLARÉ par la part multipart ; le serveur ne
        renifle pas le contenu.
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [avatar, vehicle, dish, store, brand, feed, banner, class, equipment, marker]}, description: "préfixe de la clé d'objet ; `class` = pictogrammes des modes de véhicule, `equipment` = photos du matériel du catalogue, `marker` = pictogrammes des marqueurs de carte (console)"}
        - {in: query, name: entity, schema: {type: string}, description: identifiant facultatif qui regroupe les objets}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
                  duration_seconds: {type: integer, description: "vidéos seulement : lue dans le conteneur"}
        "401": {description: missing_token}
        "422": {description: "validation_failed (type, poids, kind, champ `file` absent), video_too_long, video_unreadable"}
        "503": {description: storage_unavailable — le stockage d'objets n'a pas démarré}
  /wallet:
    get:
      tags: [wallet]
      summary: Own wallet
      responses:
        "200": {description: Balance}
  /wallet/transactions:
    get:
      tags: [wallet]
      summary: Own ledger
      responses:
        "200": {description: Movements}
  /wallet/purchase:
    post:
      tags: [wallet]
      summary: Buy tokens
      responses:
        "201": {description: Payment started}
  /admin/fleets:
    get:
      tags: [admin, fleet]
      summary: List private fleets
      description: >
        Les sociétés qui possèdent des véhicules conduits par d'autres. Au
        socle et non dans une verticale : une même société possède des motos
        qui livrent et des voitures qui font des courses.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Fleets}
    post:
      tags: [admin, fleet]
      summary: Register a fleet
      description: >
        `commission_bp` ABSENT signifie « suit le taux de la plateforme » ;
        zéro signifie une gratuité négociée. Les deux ne se confondent pas.
      responses:
        "201": {description: Created}
        "409": {description: A fleet already carries this name}
  /admin/fleets/{id}:
    get:
      tags: [admin, fleet]
      summary: One fleet
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Fleet}
        "404": {description: Not found}
    patch:
      tags: [admin, fleet]
      summary: Update a fleet
      description: >
        Chaque champ est facultatif et seul ce qui est envoyé change.
        Suspendre une flotte ne suspend PAS ses conducteurs : ce sont deux
        décisions distinctes.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Fleet}
        "404": {description: Not found}
  /admin/staff:
    get:
      tags: [admin, staff]
      summary: List Dira staff
      description: >
        Un membre du staff EST un compte `admin`, avec une fonction et un
        PÉRIMÈTRE. ⚠️ `scopes` VIDE N'ACCORDE RIEN : couvrir toute la
        plateforme s'écrit en énumérant les trois portées. `covers_everything`
        est un résumé calculé, `scopes` reste la seule vérité.
      parameters:
        - {name: function, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, enum: [core, food, vtc]}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Staff}
    post:
      tags: [admin, staff]
      summary: Attach a staff record to an admin account
      description: >
        Le compte doit déjà porter le rôle `admin`, et au moins une portée est
        exigée : une fiche qui n'accorde rien fait croire à une habilitation.
        ⚠️ Réservé aux membres dont la FONCTION est `admin` — une habilitation
        qu'on peut s'accorder soi-même n'en est pas une.
      responses:
        "201": {description: Created}
        "409": {description: This account already has a staff record}
        "422": {description: Validation failed}
  /admin/staff/vocabulary:
    get:
      tags: [admin, staff]
      summary: Known functions and scopes
      description: >
        Pour que la console propose exactement ce que le serveur accepte.
        Deux listes recopiées divergeraient au premier ajout.
        `empty_scopes_means` vaut `nothing`.
      responses:
        "200": {description: Vocabulary}
  /admin/staff/{id}:
    patch:
      tags: [admin, staff]
      summary: Update a staff record
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Staff member}
        "404": {description: Not found}
    delete:
      tags: [admin, staff]
      summary: Remove a staff record
      description: >
        Retire la FICHE, pas le COMPTE : les actions passées restent
        attribuées dans le journal d'audit.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Removed}
        "404": {description: Not found}
  /admin/wallets/{ownerID}:
    get:
      tags: [wallet]
      summary: One wallet, whoever owns it
      description: >-
        GÉNÉRIQUE : un propriétaire est un point de vente, un livreur ou un
        chauffeur — le socle ne fait pas la différence, et n'a pas à la faire.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Wallet}
  /admin/wallets/{ownerID}/purchase:
    post:
      tags: [wallet]
      summary: Start a token purchase for an owner
      description: Initie un vrai paiement, à honorer.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "201": {description: Payment started}
  /admin/wallets/{ownerID}/credit:
    post:
      tags: [wallet]
      summary: Grant tokens without payment
      description: >-
        ⚠️ SANS contrepartie financière — un geste commercial. Justificatif
        exigé, et l'écriture porte la trace de qui l'a accordé.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Wallet}
  /admin/wallets/{ownerID}/transactions:
    get:
      tags: [wallet]
      summary: One wallet's ledger
      description: >-
        Le grand livre d'UN portefeuille, désigné par son propriétaire — la
        fiche d'un compte. Chaque mouvement dit son `unit` (`token` ou
        `xof`) : un relevé n'additionne pas des jetons et des francs.
      parameters:
        - {name: ownerID, in: path, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "200": {description: Transactions}
        "404": {description: wallet_not_found}
  /admin/wallets/{ownerID}/promo:
    post:
      tags: [wallet]
      summary: Grant a promotional credit (XOF) to a client
      description: >-
        Un geste commercial en ARGENT — dépensé avant l'argent réel du
        client, jamais confondu avec lui au grand livre (`promo_credit`).
        Justificatif exigé, journal d'audit. Le portefeuille est créé s'il
        n'existe pas.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_xof, justification]
              properties:
                amount_xof: {type: integer, minimum: 1}
                justification: {type: string, minLength: 3, maxLength: 500}
      responses:
        "200": {description: Wallet}
  /admin/wallets:
    get:
      tags: [wallet]
      summary: Les portefeuilles du pays courant — quatre soldes et le titulaire
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [client, driver, merchant]}}
        - {name: owner_id, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: "Wallets — `balance` (jetons), `balance_xof`, `promo_xof`, `debt_xof`, `owner_name` pour un compte (une boutique reste un identifiant)"}
  /admin/ledger:
    get:
      tags: [wallet]
      summary: Les mouvements de tous les portefeuilles du pays courant, les derniers d'abord
      description: >-
        Chaque ligne dit son UNITÉ (`token` ou `xof`), son motif, ce qu'elle
        paie (`ref_kind`, `ref_id`), son titulaire, et `ref` (la source d'un
        paiement, `debt_delta` d'un mouvement de dette). `amount` est TOUJOURS
        positif : le sens vient de `kind` (`purchase` crédite, `consume`
        débite).
      parameters:
        - {name: wallet_id, in: query, schema: {type: string}}
        - {name: owner_type, in: query, schema: {type: string, enum: [client, driver, merchant]}}
        - {name: unit, in: query, schema: {type: string, enum: [token, xof]}}
        - {name: reason, in: query, schema: {type: string}}
        - {name: ref_kind, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: Ledger rows}
  /admin/wallets/{ownerID}/settle-debt:
    post:
      tags: [wallet]
      summary: Une dette réglée à l'agence (espèces, mobile money), hors solde
      description: >-
        `debt_xof` d'un portefeuille : la commission d'une course en espèces
        que le solde n'a pas pu payer, un paiement refusé à la livraison.
        Remboursée d'office sur le prochain crédit en argent ; ici, ce qui a
        été réglé en main propre. Jamais plus que la dette (422).
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_xof]
              properties:
                amount_xof: {type: integer, minimum: 1}
                note: {type: string, maxLength: 300}
      responses:
        "200": {description: Wallet — `debt_xof` mis à jour}
  /admin/finance/billing:
    get:
      tags: [finance]
      summary: La facturation du pays courant
      description: >-
        Par métier (`rides`, `deliveries`) : `agent_charge` ∈ tokens |
        commission, `commission_pct`, la grille de jetons (`tokens_per_ride`,
        `tokens_per_km`, `tokens_min`, `tokens_max` — la livraison garde sa
        grille `platform_pricing` quand ils sont à zéro), `client_charge_at` ∈
        request | accept | start | complete (portefeuille Dira seulement —
        le mobile money se paie d'avance, les espèces à la remise),
        `debt_limit_xof`. Défauts : courses en commission à la classe, client
        débité à l'acceptation ; livraison en jetons, client débité à la
        commande. Les verticales le lisent (`GET /internal/finance/billing`).
      responses:
        "200":
          description: Billing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Billing"}
    put:
      tags: [finance]
      summary: Régler la facturation du pays courant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rides: {$ref: "#/components/schemas/VerticalBilling"}
                deliveries: {$ref: "#/components/schemas/VerticalBilling"}
      responses:
        "200": {description: Billing}
        "422": {description: "`invalid billing` — `reason` dit quoi"}
  /admin/finance/overview:
    get:
      tags: [finance]
      summary: L'aperçu comptable d'une période
      description: >-
        La balance des comptes du plan (débit, crédit, solde — un passif est
        ce que la plateforme doit, un produit ce qu'elle a gagné), les
        indicateurs (`kpis` : produits par nature, charges, net, passifs,
        créances, transit, à classer, encaissé), le détail par motif et par
        jour, l'état des portefeuilles à l'instant (`wallets`), le nombre de
        constats ouverts et le dernier balayage. `balanced` dit si la période
        s'équilibre. Défaut : le dernier mois.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Overview}
  /admin/finance/journal:
    get:
      tags: [finance]
      summary: Le journal — une écriture par mouvement, en partie double
      parameters:
        - {name: account, in: query, schema: {type: string}, description: un compte du plan (`GET /admin/finance/accounts`)}
        - {name: reason, in: query, schema: {type: string}}
        - {name: service, in: query, schema: {type: string, enum: [core, vtc, food]}}
        - {name: ref_kind, in: query, schema: {type: string}}
        - {name: ref_id, in: query, schema: {type: string}}
        - {name: owner_id, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string, enum: [xof, token]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountingEntry"}}
                  next_cursor: {type: string}
  /admin/finance/accounts:
    get:
      tags: [finance]
      summary: Le plan comptable (code, nature, libellé)
      responses:
        "200": {description: Accounts}
  /admin/finance/findings:
    get:
      tags: [finance]
      summary: Les constats du balayage d'intégrité
      description: >-
        `wallet_drift` (un solde stocké ≠ la somme de ses mouvements — jetons,
        argent, promo ou dette), `negative_balance`, `missing_entry` (un
        mouvement sans écriture), `entry_unbalanced`, `trial_unbalanced` (la
        balance générale). Dédoublonnés par empreinte, `occurrences` et
        `last_seen_at` disent depuis quand ; un écart disparu passe
        `resolved` au balayage suivant. `status` ∈ open | acknowledged |
        resolved (défaut : non résolus).
      parameters: [{name: status, in: query, schema: {type: string}}]
      responses:
        "200": {description: Findings, avec `last_run`}
  /admin/finance/findings/{id}/ack:
    post:
      tags: [finance]
      summary: Prendre acte d'un constat (avec une note)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 500}}}
      responses:
        "200": {description: Finding}
  /admin/finance/integrity/run:
    post:
      tags: [finance]
      summary: Lancer le balayage d'intégrité maintenant
      description: >-
        Le même que celui qui tourne à cadence fixe
        (`FINANCE_INTEGRITY_INTERVAL`, 15 min). Chaque constat NOUVEAU alerte
        le staff de portée `core` du pays (`staff_finance_alert`).
      responses:
        "200": {description: "Run : portefeuilles vus, écritures, constats, nouveaux, résolus"}
  /payments/providers:
    get:
      tags: [payments]
      summary: Mobile-money operators available
      responses:
        "200": {description: Providers}
  /payments/initiate:
    post:
      tags: [payments]
      summary: Start a payment
      description: >-
        `purpose` dit CE QUI est payé, et c'est lui qui décide de qui sera
        prévenu à la confirmation : `order` (livraison), `ride` et
        `ride_subscription` (courses), `wallet_topup` et `token_purchase`
        (le socle crédite lui-même).


        ⚠️ `ref_id` désigne l'objet DE CE `purpose` : une commande, une
        course, un abonnement, ou le propriétaire du portefeuille. Les
        confondre enverrait la confirmation chercher un objet qui n'existe
        pas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, ref_id, amount]
              properties:
                purpose: {type: string, enum: [order, ride, ride_subscription, token_purchase, wallet_topup]}
                ref_id: {type: string}
                amount: {type: integer}
                provider: {type: string}
                tokens: {type: integer, description: "requis (> 0) pour token_purchase"}
      responses:
        "201": {description: Payment with its checkout URL}
  /payments/{id}:
    get:
      tags: [payments]
      summary: Payment status
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Payment}
  /webhooks/payment/{provider}:
    post:
      tags: [payments]
      summary: Provider callback
      description: >-
        Signature vérifiée. Confirmer le paiement d'un objet suppose de
        prévenir la VERTICALE, seule à savoir ce qu'est une commande, une
        course ou un abonnement : le rappel part en file, avec le `purpose`
        du paiement, et les reprises sont durables.


        ⚠️ Un échec de mise en file fait ÉCHOUER le webhook, et il le faut :
        le prestataire réessaie. Acquitter sans avoir enfilé le rappel
        laisserait l'objet payé et jamais confirmé.
      parameters: [{name: provider, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Acknowledged}
  /me/notifications:
    get:
      tags: [notifications]
      summary: Own inbox
      responses:
        "200": {description: Notifications}
  /me/notifications/read:
    post:
      tags: [notifications]
      summary: Mark the whole inbox read
      responses:
        "204": {description: Read}
  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Read}
  /me/devices:
    post:
      tags: [notifications]
      summary: Register a push token
      responses:
        "204": {description: Registered}
  /me/devices/{token}:
    delete:
      tags: [notifications]
      summary: Forget a push token
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Forgotten}
  /admin/message-templates:
    get:
      tags: [notifications]
      summary: List message templates
      responses:
        "200": {description: Templates}
  /admin/message-templates/{key}:
    put:
      tags: [notifications]
      summary: Update a template
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Template}
  /admin/message-templates/{key}/preview:
    post:
      tags: [notifications]
      summary: Render a template with sample variables
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Rendered message}
  /admin/campaigns:
    get:
      tags: [notifications]
      summary: Campaigns and alerts sent to a population, newest first
      responses:
        "200": {description: Campaigns}
    post:
      tags: [notifications]
      summary: Publish an alert or a campaign
      description: >-
        Un message à une POPULATION (`roles` : client, driver, merchant) plutôt
        qu'à une personne. `kind` : `alert` — une information de service, qui
        NE SE COUPE PAS ; `campaign` — une promotion, qui respecte le réglage
        « promotions » de chacun. `locales.fr` obligatoire (le repli) ; chacun
        reçoit la langue de son appareil. `send_at` absent ou passé = tout de
        suite ; sinon programmée (un tic par 30 s). `data` voyage jusqu'à
        l'application (`url`, `screen`…). L'envoi est mené en arrière-plan :
        relire la campagne pour suivre `recipients`, `muted`, `devices`,
        `pushed`, `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, locales, roles]
              properties:
                kind: {type: string, enum: [alert, campaign]}
                locales: {type: object, additionalProperties: {type: object, properties: {title: {type: string}, body: {type: string}}}}
                roles: {type: array, items: {type: string, enum: [client, driver, merchant]}}
                data: {type: object, additionalProperties: {type: string}}
                note: {type: string, maxLength: 300}
                send_at: {type: string, format: date-time}
      responses:
        "201": {description: Campaign}
        "422": {description: "`locales.fr` manquant, rôles inconnus"}
        "503": {description: "`campaigns_unavailable`"}
  /admin/campaigns/test:
    post:
      tags: [notifications]
      summary: Send the text to the caller's own phones, without recording anything
      responses:
        "200": {description: "{ sent }"}
  /admin/campaigns/{id}:
    get:
      tags: [notifications]
      summary: One campaign, with its progress
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Campaign}
        "404": {description: campaign_not_found}
  /admin/campaigns/{id}/cancel:
    post:
      tags: [notifications]
      summary: Cancel a campaign that has not started
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Campaign}
        "409": {description: "`campaign_started` — déjà partie, un message envoyé ne se rappelle pas"}
  /stores/{id}/ratings:
    get:
      tags: [ratings]
      summary: Reviews of a point of sale
      description: >-
        Lisible SANS compte : c'est ce qui aide à choisir avant même de
        s'inscrire.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Reviews}
  /agents/{id}/ratings:
    get:
      tags: [ratings]
      summary: Reviews of a courier
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Reviews}
  /dishes/{id}/ratings:
    get:
      tags: [ratings]
      summary: Reviews of a dish
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Reviews}
  # ---------------------------------------------------------------- matériel
  /equipment/catalogue:
    get:
      tags: [equipment]
      summary: Items offered to me (driver / courier)
      description: >-
        Le MATÉRIEL — gilet, sac, téléphone, casque — vendu, loué ou prêté aux
        livreurs et chauffeurs. `vertical` dit de quel métier on relève (le
        rôle est `driver` pour les deux). Actifs, de mon pays, pour ma
        verticale.
      parameters: [{name: vertical, in: query, required: true, schema: {type: string, enum: [food, vtc]}}]
      responses:
        "200": {description: Items, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentItem"}}}}}}}
  /equipment/requests:
    post:
      tags: [equipment]
      summary: Ask for an item from the app
      description: >-
        Ouvert par pays (`agent_can_request`). Crée un contrat `requested` que
        l'exploitation qualifie ; l'équipe est alertée
        (`staff_equipment_requested`).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [vertical, item_id, mode], properties: {vertical: {type: string, enum: [food, vtc]}, item_id: {type: string}, mode: {type: string, enum: [sale, rental, loan]}, quantity: {type: integer, minimum: 1, maximum: 10}, note: {type: string, maxLength: 1000}}}}}
      responses:
        "201": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "403": {description: equipment_requests_closed}
        "409": {description: equipment_mode_not_allowed · equipment_not_offered}
  /me/equipment:
    get:
      tags: [equipment]
      summary: My contracts and where I stand
      responses:
        "200": {description: Contracts + standing, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentContract"}}, standing: {$ref: "#/components/schemas/EquipmentStanding"}}}}}}
  /me/equipment/{id}/accept:
    post:
      tags: [equipment]
      summary: Accept the terms of a proposed contract
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "409": {description: equipment_bad_status}
  /me/equipment/{id}/pay:
    post:
      tags: [equipment]
      summary: Pay from my Dira balance (couriers)
      description: >-
        Borné à ce qui reste dû. Un chauffeur VTC n'a pas de solde ici :
        `409 equipment_no_wallet` — son matériel se règle au grand livre des
        courses.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [amount_xof], properties: {amount_xof: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "402": {description: insufficient_funds}
        "409": {description: equipment_no_wallet · equipment_nothing_owed}
  /admin/equipment/settings:
    get:
      tags: [admin]
      summary: Equipment settings of the country (defaults every contract starts from)
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentSettings"}}}}
    put:
      tags: [admin]
      summary: Update the settings (audited)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {allowed_modes: {type: array, items: {type: string, enum: [sale, rental, loan]}}, agent_can_request: {type: boolean}, require_acceptance: {type: boolean}, max_earnings_percent: {type: integer}, default_deposit_percent: {type: integer}, staff_alert_overdue: {type: boolean}, defaults: {$ref: "#/components/schemas/EquipmentPlan"}}}}}
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentSettings"}}}}
  /admin/equipment/items:
    get:
      tags: [admin]
      summary: The catalogue of the country
      parameters: [{name: active, in: query, schema: {type: boolean}}]
      responses:
        "200": {description: Items}
    post:
      tags: [admin]
      summary: Add an item
      responses:
        "201": {description: Item, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentItem"}}}}
  /admin/equipment/items/{id}:
    patch:
      tags: [admin]
      summary: Update an item (whole body)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Item}
  /admin/equipment/contracts:
    get:
      tags: [admin]
      summary: Contracts of the country
      parameters:
        - {name: user_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: vertical, in: query, schema: {type: string, enum: [food, vtc]}}
        - {name: item_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Contracts, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentContract"}}, next_cursor: {type: string}}}}}}
    post:
      tags: [admin]
      summary: Prepare a contract for a person
      description: >-
        Les réglages tombent en cascade — le contrat, puis l'article, puis le
        pays — et chaque montant absent vient de l'article. `hand_over_now`
        remet à la création (l'échéancier démarre, ce qui est dû à la remise
        est prélevé si le plan le permet). Sinon l'agent reçoit
        `equipment_contract_proposed` et accepte dans l'app quand
        `require_acceptance` l'exige.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [user_id, vertical, item_id, mode], properties: {user_id: {type: string}, vertical: {type: string, enum: [food, vtc]}, item_id: {type: string}, quantity: {type: integer}, serial: {type: string}, mode: {type: string, enum: [sale, rental, loan]}, price_xof: {type: integer}, deposit_xof: {type: integer}, plan: {$ref: "#/components/schemas/EquipmentPlan"}, notes: {type: string}, hand_over_now: {type: boolean}}}}}
      responses:
        "201": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "409": {description: equipment_mode_not_allowed · equipment_not_offered · equipment_out_of_stock}
        "422": {description: plan.* (fields) — earnings_percent over max…}
  /admin/equipment/contracts/{id}:
    get:
      tags: [admin]
      summary: One contract
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
    patch:
      tags: [admin]
      summary: Serial, notes, plan — price and deposit before hand-over only
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_handed_over}
  /admin/equipment/contracts/{id}/qualify:
    post:
      tags: [admin]
      summary: Turn a request into a draft the agent must accept
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/hand-over:
    post:
      tags: [admin]
      summary: The item is handed over — the schedule starts
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_not_accepted · equipment_bad_status · equipment_out_of_stock}
  /admin/equipment/contracts/{id}/payments:
    post:
      tags: [admin]
      summary: Record a payment received by hand (cash, transfer, mobile money seen) or a waiver
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [amount_xof, source], properties: {amount_xof: {type: integer, minimum: 1}, source: {type: string, enum: [manual, mobile_money, waiver]}, note: {type: string}}}}}
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/return:
    post:
      tags: [admin]
      summary: The item comes back — condition, damage fee, deposit refund
      description: >-
        La caution est rendue (moins les dégâts) quand le plan le dit ou que
        `refund_deposit` le demande : sur le solde Dira d'un livreur à
        l'instant ; au grand livre d'un chauffeur VTC à la prochaine course.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {condition: {type: string}, damage_fee_xof: {type: integer, minimum: 0}, refund_deposit: {type: boolean}}}}}
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/cancel:
    post:
      tags: [admin]
      summary: Cancel a contract that was never handed over
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_bad_status — a live contract ends by a return or a default}
  /admin/equipment/contracts/{id}/default:
    post:
      tags: [admin]
      summary: Close a contract as unpaid
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/lines/{n}/waive:
    post:
      tags: [admin]
      summary: Waive one schedule line (a late fee, an instalment)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: n, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/standing/{userID}:
    get:
      tags: [admin]
      summary: Where a person stands, all contracts together
      parameters: [{name: userID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Standing, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentStanding"}}}}
  /admin/audit:
    get:
      tags: [admin]
      summary: The platform's audit journal — every service, one timeline
      description: >-
        UN SEUL JOURNAL. Chaque service tenait le sien et la console ne lisait
        que celui de la livraison : une suspension de compte (socle), une
        immobilisation de véhicule (courses) n'apparaissaient nulle part. Les
        verticales écrivent désormais ici (`POST /internal/audit`), chaque
        entrée porte `service` ∈ `core` · `vtc` · `food`, et cette route rend
        tout, du plus récent au plus ancien.
      parameters:
        - {name: service, in: query, schema: {type: string, enum: [core, vtc, food]}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        service: {type: string}
                        actor_id: {type: string}
                        actor_role: {type: string}
                        action: {type: string, example: ticket.update}
                        resource_type: {type: string}
                        resource_id: {type: string}
                        before: {type: object}
                        after: {type: object}
                        created_at: {type: string, format: date-time}
                  next_cursor: {type: string}
  /admin/users:
    get:
      tags: [admin]
      summary: Search accounts
      description: >-
        L'annuaire est COMMUN aux deux verticales : la console des repas et
        celle des courses cherchent la même personne. La fiche complète d'un
        livreur — solde, véhicules, courses — se compose dans la verticale, à
        partir de ces lignes.
      parameters:
        - {name: role, in: query, schema: {type: string, enum: [client, driver, merchant, admin]}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: q, in: query, schema: {type: string}, description: Nom ou téléphone}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: Accounts}
    post:
      tags: [admin]
      summary: Open an account from the back-office
      description: >-
        Tout rôle, admin compris. Un `driver` reçoit son portefeuille de
        jetons à l'ouverture. Le téléphone est l'identifiant : un doublon
        rend 409 `phone_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name, phone, password]
              properties:
                role: {type: string, enum: [client, driver, merchant, admin]}
                name: {type: string}
                phone: {type: string, description: E.164}
                email: {type: string}
                password: {type: string, minLength: 8}
      responses:
        "201": {description: Account}
        "409": {description: phone_taken}
  /admin/users/{id}:
    get:
      tags: [admin]
      summary: One account
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Account}
        "404": {description: user_not_found}
    patch:
      tags: [admin]
      summary: Correct an account's identity
      description: >-
        Les champs absents ne bougent pas. `password` remplace le mot de passe
        sans exiger l'ancien — c'est un geste d'administration, tracé à
        l'audit. Le statut a sa propre route.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, description: E.164}
                password: {type: string, minLength: 8}
                avatar_url: {type: string}
      responses:
        "200": {description: Account}
        "404": {description: user_not_found}
    delete:
      tags: [admin]
      summary: Delete an account
      description: >-
        Définitif. Les écritures qui le citent — commandes, courses,
        portefeuilles — restent pour la comptabilité. On ne se supprime pas
        soi-même (409 `cannot_delete_self`) ; suspendre est le geste
        réversible qui répond au même besoin.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "404": {description: user_not_found}
        "409": {description: cannot_delete_self}
  /admin/users/{id}/status:
    patch:
      tags: [admin]
      summary: Activate or suspend an account
      description: >-
        Rend l'état AVANT la modification, pour que la trace d'audit dise ce
        qui a réellement bougé. ⚠️ Une suspension ne ferme pas les sessions en
        cours : les verticales vérifient le jeton localement, sans appeler le
        socle. Le rafraîchissement est refusé, donc la porte se referme au plus
        tard à l'expiration de l'accès.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Previous state and new status}
        "404": {description: user_not_found}
        "422": {description: status must be active or suspended}
components:
  schemas:
    MapMarker:
      type: object
      description: Un marqueur de carte hors véhicule, ses images et ses pins numérotés.
      properties:
        kind: {type: string, enum: [courier, client, merchant]}
        icon_url: {type: string, format: uri, description: "à côté d'un nom, dans une liste"}
        map_icon_url: {type: string, format: uri, description: "le pin PRINCIPAL sur une carte À PLAT — vue de dessus, caméra à 90°"}
        nav_icon_url:
          type: string
          format: uri
          description: >-
            Le même marqueur sur une carte de NAVIGATION, inclinée : vue 3D,
            caméra à ~45°. Servi pour les seuls genres qui BOUGENT —
            aujourd'hui `courier`.


            ⚠️ La distinction n'est pas « véhicule / pas véhicule », c'est
            « couché sur la route / debout sur la carte ». Un livreur est
            dessiné à plat sur la chaussée, et une vue de dessus y paraît
            écrasée dès que la caméra penche. Un client, un marchand, une
            étape sont des pastilles qui se DRESSENT : même image quelle que
            soit l'inclinaison.


            Absent : retombez sur `map_icon_url`.
        dest_icon_url:
          type: string
          format: uri
          description: >-
            Le point d'ARRIVÉE — la fin d'une course. Servi pour les seuls
            genres qui en ont un : aujourd'hui `client`.


            ⚠️ Le client et sa destination ne sont pas le même point. Le pin
            PRINCIPAL marque QUELQU'UN — le passager qui attend au départ, la
            personne à qui on remet une commande ; celui-ci marque un LIEU où
            personne n'attend encore. Les dessiner pareil oblige à lire les
            libellés pour savoir lequel est lequel, ce qu'on n'a pas le temps
            de faire sur une carte.


            Un marchand n'en a pas : une boutique est une ÉTAPE, la
            destination de personne.


            Absent : retombez sur `map_icon_url`.
        numbered:
          type: array
          description: >-
            Les pins NUMÉROTÉS, rangs 1 à 4, toujours servis au complet même
            vides — une liste trouée obligerait à deviner si un rang manque
            parce qu'il n'est pas réglé ou parce qu'il n'existe pas. ABSENT
            pour `courier`, qui n'en porte pas : un champ absent se lit
            « sans objet », une liste vide se lirait « rien de réglé ».


            Le numéro est une affaire de CARTE : dans une liste, le nom
            distingue déjà les points. C'est pourquoi un pin numéroté ne porte
            que `map_icon_url`.
          items:
            type: object
            properties:
              index: {type: integer, minimum: 1, maximum: 4, description: "le rang du PASSAGE — la 1re collecte porte le pin 1"}
              map_icon_url: {type: string, format: uri}
        max_numbered: {type: integer, description: "combien de rangs existent, pour ne pas coder le nombre en dur"}
        updated_at: {type: string, format: date-time}
    EquipmentPlan:
      type: object
      description: >-
        COMMENT l'argent revient. Tout est facultatif et défaut aux réglages du
        pays ; un contrat ne porte que ce qu'il surcharge.
      properties:
        schedule: {type: string, enum: [upfront, installments, per_period, none], description: "comptant à la remise · N échéances · un loyer par période · rien"}
        installments: {type: integer, minimum: 0, maximum: 60}
        period: {type: string, enum: [daily, weekly, biweekly, monthly]}
        first_due_days: {type: integer, minimum: 0, description: "jours entre la remise et la première échéance"}
        collect_from_earnings: {type: boolean, description: "retenir sur chaque gain"}
        collect_from_wallet: {type: boolean, description: "prélever le solde Dira à l'échéance (livreurs) / porter au grand livre à la prochaine course (chauffeurs)"}
        allow_partial: {type: boolean, description: "prendre ce qu'il y a quand le solde ne couvre pas"}
        earnings_percent: {type: integer, minimum: 0, maximum: 100}
        earnings_fixed_xof: {type: integer, minimum: 0}
        min_left_xof: {type: integer, minimum: 0, description: "ce qu'on laisse au moins à l'agent sur un gain"}
        daily_cap_xof: {type: integer, minimum: 0}
        weekly_cap_xof: {type: integer, minimum: 0}
        earnings_only_when_due: {type: boolean, description: "ne retenir que l'échu (sinon la retenue rembourse en avance)"}
        grace_days: {type: integer, minimum: 0}
        late_fee_xof: {type: integer, minimum: 0}
        late_fee_percent: {type: integer, minimum: 0, maximum: 100}
        block_after_days: {type: integer, minimum: 0, description: "0 = jamais bloqué"}
        reminder_days: {type: integer, minimum: 0}
        deposit_refundable: {type: boolean}
    EquipmentItem:
      type: object
      properties:
        id: {type: string}
        country: {type: string}
        kind: {type: string, enum: [vest, bag, phone, helmet, box, other]}
        name: {type: string}
        description: {type: string}
        photos: {type: array, items: {type: string}}
        audiences: {type: array, items: {type: string, enum: [food, vtc]}, description: "vide = les deux"}
        sale_price_xof: {type: integer}
        rental_daily_xof: {type: integer}
        rental_weekly_xof: {type: integer}
        rental_monthly_xof: {type: integer}
        deposit_xof: {type: integer}
        stock: {type: integer}
        track_stock: {type: boolean}
        active: {type: boolean}
        default_plan: {$ref: "#/components/schemas/EquipmentPlan"}
    EquipmentContract:
      type: object
      properties:
        id: {type: string}
        user_id: {type: string}
        user_name: {type: string, description: ADMIN seulement}
        vertical: {type: string, enum: [food, vtc]}
        item_id: {type: string}
        item_name: {type: string}
        item_kind: {type: string}
        quantity: {type: integer}
        serial: {type: string}
        mode: {type: string, enum: [sale, rental, loan]}
        plan: {$ref: "#/components/schemas/EquipmentPlan"}
        status: {type: string, enum: [requested, draft, accepted, active, returned, completed, defaulted, cancelled]}
        price_xof: {type: integer, description: "prix total (vente) ou loyer par période (location)"}
        deposit_xof: {type: integer}
        paid_xof: {type: integer}
        outstanding_xof: {type: integer}
        due_xof: {type: integer}
        overdue_since: {type: string, format: date-time}
        blocked: {type: boolean}
        schedule:
          type: array
          items:
            type: object
            properties:
              n: {type: integer}
              kind: {type: string, enum: [deposit, installment, period, damage]}
              due_at: {type: string, format: date-time}
              amount_xof: {type: integer}
              late_fee_xof: {type: integer}
              paid_xof: {type: integer}
              owed_xof: {type: integer}
              paid_at: {type: string, format: date-time}
              status: {type: string, enum: [pending, due, overdue, paid, waived]}
        payments:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              at: {type: string, format: date-time}
              amount_xof: {type: integer, description: "négatif = rendu à l'agent"}
              source: {type: string, enum: [earnings, wallet, ledger, mobile_money, manual, waiver, refund]}
              ref_kind: {type: string}
              ref_id: {type: string}
              note: {type: string}
              pending: {type: boolean}
        return_condition: {type: string}
        damage_fee_xof: {type: integer}
        next_period_at: {type: string, format: date-time}
        notes: {type: string}
        handed_at: {type: string, format: date-time}
        returned_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    EquipmentStanding:
      type: object
      properties:
        contracts: {type: integer}
        outstanding_xof: {type: integer}
        due_xof: {type: integer}
        overdue_xof: {type: integer}
        blocked: {type: boolean, description: "le retard passe le seuil : plus de mise en ligne"}
    VerticalBilling:
      type: object
      properties:
        agent_charge: {type: string, enum: [tokens, commission]}
        commission_pct: {type: integer, minimum: 0, maximum: 100}
        tokens_per_ride: {type: integer}
        tokens_per_km: {type: integer}
        tokens_min: {type: integer}
        tokens_max: {type: integer}
        client_charge_at: {type: string, enum: [request, accept, start, complete]}
        debt_limit_xof: {type: integer}
    Billing:
      type: object
      properties:
        country: {type: string}
        rides: {$ref: "#/components/schemas/VerticalBilling"}
        deliveries: {$ref: "#/components/schemas/VerticalBilling"}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    AccountingEntry:
      type: object
      properties:
        id: {type: string}
        country: {type: string}
        at: {type: string, format: date-time}
        service: {type: string, enum: [core, vtc, food]}
        reason: {type: string}
        ref_kind: {type: string}
        ref_id: {type: string}
        transaction_id: {type: string}
        wallet_id: {type: string}
        owner_id: {type: string}
        unit: {type: string, enum: [xof, token]}
        amount: {type: integer, description: en francs — les jetons sont valorisés au prix du jeton}
        tokens: {type: integer}
        description: {type: string}
        lines:
          type: array
          items:
            type: object
            properties:
              account: {type: string}
              debit: {type: integer}
              credit: {type: integer}
    EquipmentSettings:
      type: object
      properties:
        country: {type: string}
        allowed_modes: {type: array, items: {type: string}}
        agent_can_request: {type: boolean}
        require_acceptance: {type: boolean}
        max_earnings_percent: {type: integer}
        default_deposit_percent: {type: integer}
        staff_alert_overdue: {type: boolean}
        defaults: {$ref: "#/components/schemas/EquipmentPlan"}
        kinds: {type: array, items: {type: string}}
        modes: {type: array, items: {type: string}}
        periods: {type: array, items: {type: string}}
        schedules: {type: array, items: {type: string}}
    Country:
      type: object
      properties:
        code: {type: string, example: TG}
        name: {type: string, example: Togo}
        currency: {type: string, example: XOF, description: ISO 4217 — la monnaie EN VIGUEUR (réglage ou catalogue)}
        currency_name: {type: string, example: Franc CFA (UEMOA)}
        currency_symbol: {type: string, example: F CFA, description: à écrire après le montant}
        currency_decimals: {type: integer, example: 0, description: 0 = l'entier stocké est l'unité ; 2 = l'entier est en centièmes}
        phone_prefix: {type: string, example: "+228"}
        locale: {type: string, example: fr}
        timezone: {type: string, example: Africa/Lome}
        center:
          type: array
          items: {type: number}
          description: "[lng, lat] de la capitale économique"
        enabled: {type: boolean}
        default: {type: boolean}
    CountryResolution:
      type: object
      properties:
        country:
          type: string
          description: Le pays RETENU — à envoyer dans X-Dira-Country et à considérer comme celui du compte.
        source: {type: string, enum: [geo, ip, account, default]}
        detected:
          type: string
          description: Où la position ou l'adresse IP situe la personne, même hors zone.
        supported: {type: boolean, description: "`detected` est un pays ouvert"}
        updated: {type: boolean, description: le pays du compte a changé}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
security:
  - bearerAuth: []
